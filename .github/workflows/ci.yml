name: Laravel CI/CD

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    name: Build (Composer and Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Check code style
        run: vendor/bin/pint --test

  test:
    name: Test (Artisan)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none
      - name: Install dependencies in this runner
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests
        run: php artisan test

  staging:
    name: Staging (simulation)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Simulate staging deployment
        run: echo 'Deploy to staging (simulation only)'

  production:
    name: Production (simulation)
    needs: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Show deploy.sh steps without deploying
        run: |
          echo 'cd /var/www/aplikasi'
          echo '1. php artisan down --retry=60'
          echo '2. git pull origin main'
          echo '3. composer install --no-dev --optimize-autoloader'
          echo '4. php artisan migrate --force'
          echo '5. php artisan config:cache'
          echo '   php artisan route:cache'
          echo '   php artisan view:cache'
          echo '6. php artisan queue:restart'
          echo '7. php artisan up'
